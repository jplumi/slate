services:
  slate-server:
    container_name: slate-server
    image: jplumi/slate-server:latest
    restart: unless-stopped
    environment:
      - SLATE_API_KEY=token
    ports:
      - "8081:8081"
    volumes:
      - ./data:/app/data
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
